<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Enterprise Indoor PDR Map</title>
  
  <!-- CDN Dependencies -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html, #root { width: 100%; height: 100%; overflow: hidden; background-color: #030712; font-family: system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { createClient } = supabase;

    const SUPABASE_URL = "https://gnhkgjqiqeoraygzjikd.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImduaGtnanFpcWVvcmF5Z3pqaWtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTIxMzIsImV4cCI6MjEwNDk2ODEzMn0.AvHjI6gAQA-LnPJY99BtbDnB2ryKj7NXwkXIj7AI0Uk";
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Advanced Multi-Room Architectural Floor Plan (Bounds: X: 0-700, Y: 0-480)
    const BUILDING_LAYOUT = {
      rooms: [
        { id: "R1", name: "Main Entrance", bounds: { x: 40, y: 360, w: 160, h: 90 }, center: [120, 405], color: "#1e293b" },
        { id: "R2", name: "Reception Lobby", bounds: { x: 40, y: 200, w: 160, h: 140 }, center: [120, 270], color: "#0f172a" },
        { id: "R3", name: "Open Workspace", bounds: { x: 230, y: 30, w: 240, h: 220 }, center: [350, 140], color: "#0f172a" },
        { id: "R4", name: "Conference Room", bounds: { x: 500, y: 30, w: 160, h: 140 }, center: [580, 100], color: "#1e293b" },
        { id: "R5", name: "Executive Suite", bounds: { x: 500, y: 190, w: 160, h: 120 }, center: [580, 250], color: "#1e293b" },
        { id: "R6", name: "Server Room / IT Lab", bounds: { x: 40, y: 30, w: 160, h: 150 }, center: [120, 105], color: "#1e293b" },
        { id: "R7", name: "Cafeteria & Lounge", bounds: { x: 230, y: 280, w: 240, h: 170 }, center: [350, 365], color: "#0f172a" }
      ],
      corridors: [
        { name: "Main Corridor", bounds: { x: 205, y: 30, w: 20, h: 420 } },
        { name: "East Corridor", bounds: { x: 475, y: 30, w: 20, h: 420 } }
      ]
    };

    function App() {
      const [deviceRole, setDeviceRole] = useState(null);
      const [userId] = useState(`DEV-${Math.floor(1000 + Math.random() * 9000)}`);
      const [position, setPosition] = useState([120, 405]); // Starts at Entrance
      const [heading, setHeading] = useState(0);
      const [activeZone, setActiveZone] = useState("Main Entrance");
      const [stepCount, setStepCount] = useState(0);
      const [peerDevices, setPeerDevices] = useState({});
      const [isConnected, setIsConnected] = useState(false);
      const [isWalkingMode, setIsWalkingMode] = useState(false);
      const [detectionState, setDetectionState] = useState("LOCKED (Stationary)");
      
      const pdrState = useRef({ lastZ: 0, lastStepTime: 0 });
      const channelRef = useRef(null);
      const headingRef = useRef(0);
      const positionRef = useRef([120, 405]);
      const walkingModeRef = useRef(false);

      useEffect(() => { positionRef.current = position; }, [position]);
      useEffect(() => { headingRef.current = heading; }, [heading]);
      useEffect(() => { walkingModeRef.current = isWalkingMode; }, [isWalkingMode]);

      useEffect(() => {
        const channel = supabaseClient.channel("indoor_tracking_room", { config: { broadcast: { self: false } } });
        channel.on("broadcast", { event: "location_update" }, (payload) => {
          if (payload.payload && payload.payload.userId !== userId) {
            setPeerDevices((prev) => ({ ...prev, [payload.payload.userId]: payload.payload }));
          }
        }).subscribe((status) => {
          if (status === "SUBSCRIBED") setIsConnected(true);
        });
        channelRef.current = channel;
        return () => { supabaseClient.removeChannel(channel); };
      }, [userId]);

      const calculateZone = (pos) => {
        let zone = "Central Walkway";
        BUILDING_LAYOUT.rooms.forEach((r) => {
          const { x, y, w, h } = r.bounds;
          if (pos[0] >= x && pos[0] <= x + w && pos[1] >= y && pos[1] <= y + h) {
            zone = r.name;
          }
        });
        return zone;
      };

      const transmitLocation = (newPos, currentHeading) => {
        const room = calculateZone(newPos);
        setPosition(newPos);
        setActiveZone(room);
        const payload = { userId, position: newPos, heading: currentHeading, room, timestamp: new Date().toLocaleTimeString() };
        if (channelRef.current && isConnected) {
          channelRef.current.send({ type: "broadcast", event: "location_update", payload });
        }
      };

      const startHardwareSensors = async () => {
        setDeviceRole("broadcaster");

        if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
          try {
            await DeviceMotionEvent.requestPermission();
            await DeviceOrientationEvent.requestPermission();
          } catch (e) {
            console.error(e);
          }
        }

        window.addEventListener("deviceorientation", (e) => {
          let rawHeading = 0;
          if (e.webkitCompassHeading) {
            rawHeading = e.webkitCompassHeading;
          } else if (e.alpha !== null) {
            rawHeading = 360 - e.alpha;
          }

          const alpha = 0.2;
          let diff = rawHeading - headingRef.current;
          if (diff > 180) diff -= 360;
          if (diff < -180) diff += 360;
          const smoothedHeading = Math.round((headingRef.current + alpha * diff + 360) % 360);
          
          setHeading(smoothedHeading);
        });

        window.addEventListener("devicemotion", (e) => {
          if (!walkingModeRef.current) return;

          const acc = e.acceleration;
          if (!acc || acc.z === null) return;

          const zVal = acc.z || 0;
          const zDelta = Math.abs(zVal - pdrState.current.lastZ);
          pdrState.current.lastZ = zVal;

          const now = Date.now();
          const timeSinceStep = now - pdrState.current.lastStepTime;

          if (zDelta > 3.5 && timeSinceStep > 480) {
            pdrState.current.lastStepTime = now;
            setDetectionState("Step Confirmed ✅");

            setStepCount((prevCount) => {
              const currentH = headingRef.current;
              const rad = ((currentH - 90) * Math.PI) / 180;
              const strideLength = 20;

              const dx = Math.cos(rad) * strideLength;
              const dy = Math.sin(rad) * strideLength;

              const currentPos = positionRef.current;
              const nextX = Math.max(30, Math.min(670, currentPos[0] + dx));
              const nextY = Math.max(30, Math.min(450, currentPos[1] + dy));
              
              const nextPos = [nextX, nextY];
              transmitLocation(nextPos, currentH);
              return prevCount + 1;
            });

            setTimeout(() => {
              if (walkingModeRef.current) setDetectionState("Tracking Motion...");
            }, 500);
          }
        });
      };

      const toggleWalkingMode = () => {
        const nextState = !isWalkingMode;
        setIsWalkingMode(nextState);
        setDetectionState(nextState ? "Tracking Motion..." : "LOCKED (Stationary)");
      };

      const handleManualWalk = (dir) => {
        const stepSize = 25;
        let dx = 0, dy = 0, newHeading = heading;
        if (dir === "UP") { dy = -stepSize; newHeading = 0; }
        if (dir === "DOWN") { dy = stepSize; newHeading = 180; }
        if (dir === "LEFT") { dx = -stepSize; newHeading = 270; }
        if (dir === "RIGHT") { dx = stepSize; newHeading = 90; }
        setHeading(newHeading);
        setStepCount((s) => s + 1);
        const newPos = [Math.max(30, Math.min(670, position[0] + dx)), Math.max(30, Math.min(450, position[1] + dy))];
        transmitLocation(newPos, newHeading);
      };

      return (
        <div className="relative w-full h-full flex flex-col justify-between overflow-hidden bg-gray-950 text-white">
          
          {/* Header Bar */}
          <header className="z-20 p-4 glass-card border-b border-gray-800 flex justify-between items-center shadow-2xl">
            <div>
              <h1 className="text-lg font-bold tracking-tight text-teal-400">HQ Floor Positioning System</h1>
              <p className="text-xs text-gray-400">Node ID: <span className="text-gray-200 font-mono">{userId}</span></p>
            </div>
            
            {deviceRole === "broadcaster" && (
              <button 
                onClick={toggleWalkingMode}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all border ${
                  isWalkingMode 
                    ? "bg-emerald-500/20 text-emerald-400 border-emerald-500/50 animate-pulse" 
                    : "bg-gray-800 text-gray-300 border-gray-700 hover:bg-gray-700"
                }`}
              >
                {isWalkingMode ? "🛑 Stop Walk Mode" : "🚶 Start Walking Mode"}
              </button>
            )}
          </header>

          {/* Role Selection Screen */}
          {!deviceRole && (
            <div className="absolute inset-0 z-30 flex items-center justify-center p-6 bg-gray-950/90 backdrop-blur-md">
              <div className="max-w-md w-full glass-card p-6 rounded-2xl border border-gray-800 text-center shadow-2xl">
                <div className="w-12 h-12 bg-teal-500/10 text-teal-400 rounded-xl flex items-center justify-center mx-auto mb-4 border border-teal-500/20 text-2xl">
                  🏢
                </div>
                <h2 className="text-xl font-bold mb-2">HQ Navigation Node</h2>
                <p className="text-sm text-gray-400 mb-6">Select mode to view real-time architectural PDR tracking.</p>
                
                <div className="space-y-3">
                  <button onClick={startHardwareSensors} className="w-full py-3.5 px-4 bg-teal-600 hover:bg-teal-500 text-white font-semibold rounded-xl transition-all shadow-lg active:scale-95">
                    📱 Mobile Broadcaster (Hardware PDR)
                  </button>
                  <button onClick={() => setDeviceRole("receiver")} className="w-full py-3.5 px-4 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-200 font-semibold rounded-xl transition-all active:scale-95">
                    🖥️ Live Map Observer
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SVG Map Canvas */}
          <main className="relative flex-1 w-full h-full bg-gray-950 flex items-center justify-center overflow-hidden">
            <svg viewBox="0 0 700 480" className="w-full h-full p-2 max-h-[85vh] object-contain">
              <defs>
                <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
                  <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#1f2937" strokeWidth="0.6" />
                </pattern>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="6" result="blur" />
                  <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
              </defs>

              {/* Background Grid */}
              <rect width="100%" height="100%" fill="url(#grid)" />

              {/* Outer Building Boundary */}
              <rect x="25" y="15" width="650" h="450" fill="none" stroke="#475569" strokeWidth="4" rx="16" />

              {/* Corridors */}
              {BUILDING_LAYOUT.corridors.map((c, i) => (
                <rect key={i} x={c.bounds.x} y={c.bounds.y} width={c.bounds.w} height={c.bounds.h} fill="#111827" opacity="0.6" />
              ))}

              {/* Rooms */}
              {BUILDING_LAYOUT.rooms.map((room) => {
                const isUserInRoom = activeZone === room.name;
                return (
                  <g key={room.id}>
                    <rect 
                      x={room.bounds.x} 
                      y={room.bounds.y} 
                      width={room.bounds.w} 
                      height={room.bounds.h} 
                      fill={room.color} 
                      stroke={isUserInRoom ? "#2dd4bf" : "#334155"} 
                      strokeWidth={isUserInRoom ? "2.5" : "1.5"} 
                      rx="8" 
                    />
                    {/* Door Indicators */}
                    <circle cx={room.center[0]} cy={room.bounds.y + room.bounds.h} r="3" fill="#64748b" />
                    
                    {/* Room Labels */}
                    <text x={room.center[0]} y={room.center[1] - 4} textAnchor="middle" fill={isUserInRoom ? "#5eead4" : "#94a3b8"} fontSize="12" fontWeight="700">
                      {room.name}
                    </text>
                    <text x={room.center[0]} y={room.center[1] + 12} textAnchor="middle" fill="#64748b" fontSize="9" fontWeight="600">
                      ZONE {room.id}
                    </text>
                  </g>
                );
              })}

              {/* Peer Fleet Devices */}
              {Object.values(peerDevices).map((peer) => (
                <g key={peer.userId}>
                  <circle cx={peer.position[0]} cy={peer.position[1]} r="14" fill="#3b82f6" opacity="0.25" />
                  <circle cx={peer.position[0]} cy={peer.position[1]} r="7" fill="#3b82f6" stroke="#ffffff" strokeWidth="1.5" />
                  <text x={peer.position[0]} y={peer.position[1] - 18} textAnchor="middle" fill="#60a5fa" fontSize="10" fontWeight="700">
                    {peer.userId} ({peer.room})
                  </text>
                </g>
              ))}

              {/* Active User Marker */}
              <g filter="url(#glow)">
                <circle cx={position[0]} cy={position[1]} r="22" fill="#0d9488" opacity="0.3" className="animate-ping" />
                <circle cx={position[0]} cy={position[1]} r="10" fill="#14b8a6" stroke="#ffffff" strokeWidth="2.5" />
                
                {/* Heading Arrow Pointer */}
                <line 
                  x1={position[0]} 
                  y1={position[1]} 
                  x2={position[0] + Math.cos(((heading - 90) * Math.PI) / 180) * 22} 
                  y2={position[1] + Math.sin(((heading - 90) * Math.PI) / 180) * 22} 
                  stroke="#5eead4" 
                  strokeWidth="3.5" 
                  strokeLinecap="round" 
                />

                <text x={position[0]} y={position[1] - 24} textAnchor="middle" fill="#2dd4bf" fontSize="11" fontWeight="800">
                  YOU ({activeZone})
                </text>
              </g>
            </svg>
          </main>

          {/* Footer Navigation Data Bar */}
          {deviceRole && (
            <footer className="z-20 p-4 glass-card border-t border-gray-800 flex flex-col md:flex-row gap-4 items-center justify-between">
              <div className="grid grid-cols-4 gap-2 w-full md:w-auto">
                <div className="bg-gray-900/90 border border-gray-800 p-2 rounded-xl text-center">
                  <span className="text-[10px] uppercase font-bold text-gray-400 block">Current Room</span>
                  <span className="text-xs font-bold text-teal-400 truncate block mt-0.5">{activeZone}</span>
                </div>
                <div className="bg-gray-900/90 border border-gray-800 p-2 rounded-xl text-center">
                  <span className="text-[10px] uppercase font-bold text-gray-400 block">Total Steps</span>
                  <span className="text-xs font-bold text-teal-300 block mt-0.5">{stepCount}</span>
                </div>
                <div className="bg-gray-900/90 border border-gray-800 p-2 rounded-xl text-center">
                  <span className="text-[10px] uppercase font-bold text-gray-400 block">Bearing</span>
                  <span className="text-xs font-bold text-gray-200 block mt-0.5">{heading}°</span>
                </div>
                <div className="bg-gray-900/90 border border-gray-800 p-2 rounded-xl text-center">
                  <span className="text-[10px] uppercase font-bold text-gray-400 block">Engine</span>
                  <span className="text-[11px] font-bold text-amber-400 truncate block mt-0.5">{detectionState}</span>
                </div>
              </div>

              {/* Manual Control Pad */}
              <div className="flex items-center gap-2">
                <div className="flex gap-1.5">
                  <button onClick={() => handleManualWalk("LEFT")} className="w-10 h-10 bg-gray-800 hover:bg-gray-700 active:scale-90 text-lg rounded-xl flex items-center justify-center border border-gray-700">⬅️</button>
                  <button onClick={() => handleManualWalk("UP")} className="w-10 h-10 bg-gray-800 hover:bg-gray-700 active:scale-90 text-lg rounded-xl flex items-center justify-center border border-gray-700">⬆️</button>
                  <button onClick={() => handleManualWalk("DOWN")} className="w-10 h-10 bg-gray-800 hover:bg-gray-700 active:scale-90 text-lg rounded-xl flex items-center justify-center border border-gray-700">⬇️</button>
                  <button onClick={() => handleManualWalk("RIGHT")} className="w-10 h-10 bg-gray-800 hover:bg-gray-700 active:scale-90 text-lg rounded-xl flex items-center justify-center border border-gray-700">➡️</button>
                </div>
              </div>
            </footer>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
